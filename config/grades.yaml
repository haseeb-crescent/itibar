# Narrator grade ordinal.
#
# rawis.rank_no is the source's own ordinal and it is Ibn Hajar's twelve-level
# scale of narrator verdicts from Taqrib al-Tahdhib (the `rank` strings are the
# Taqrib wording verbatim: e.g. Malik's "رأس المتقنين وكبير المتثبتين"). Higher
# rank_no = lower standing; 0 = never described (stubs). The audit verifies this.
#
# Our ordinal is higher-is-better: ordinal = 13 - rank_no for rank_no 1..12,
# so the companion level sits at the top (12). Unknown narrators (stubs, and
# the unnamed-person placeholder) get ordinal 0, below every threshold except
# `all`. Break markers are not narrators and get no ordinal.
#
# The `labels` section at the bottom is GENERATED by `make audit`
# (itibar.grades.write_labels) and lists every observed rank label with its
# rank_no, count and resulting ordinal. Do not edit it by hand.

levels:            # rank_no -> ordinal, Taqrib level name, code in the source's matn_no scale
  1:  {ordinal: 12, taqrib: "الصحابة",                    code: 0}
  2:  {ordinal: 11, taqrib: "أوثق الناس / ثقة ثقة / ثقة حافظ", code: 0}
  3:  {ordinal: 10, taqrib: "ثقة / متقن / ثبت / عدل",        code: 0}
  4:  {ordinal: 9,  taqrib: "صدوق / لا بأس به",             code: 1}
  5:  {ordinal: 8,  taqrib: "صدوق سيء الحفظ / يهم / له أوهام / تغير بأخرة", code: 2}
  6:  {ordinal: 7,  taqrib: "مقبول",                       code: 2}
  7:  {ordinal: 6,  taqrib: "مستور / مجهول الحال",           code: 2}
  8:  {ordinal: 5,  taqrib: "ضعيف",                        code: 2}
  9:  {ordinal: 4,  taqrib: "مجهول",                       code: 2}
  10: {ordinal: 3,  taqrib: "متروك / متروك الحديث / ساقط",   code: 3}
  11: {ordinal: 2,  taqrib: "متهم بالكذب",                  code: 4}
  12: {ordinal: 1,  taqrib: "كذاب / وضاع",                  code: 5}

unknown:
  ordinal: 0
  # A chain through a narrator the data does not describe cannot be placed above
  # code 2 by the classical rule on jahala (an unidentified narrator leaves the
  # chain unestablished). Used by the v1 derivation only; see DECISIONS.md.
  code: 2

companion:
  rank_no: [1]
  # Labels inside rank_no 1 that explicitly deny or fall short of companionship.
  # Narrators carrying them keep ordinal 12 (the source put them at level 1) but
  # do not get a PROPHET edge.
  exclude_labels: ["لم تثبت له صحبة", "له إدراك", "لها إدراك"]
  # Labels that make a narrator a companion regardless of rank_no. The source
  # puts 11 "young companions" at rank_no 3 or 4 (22 more are at rank_no 1).
  # Companionship only: their ordinal still follows rank_no. Disputed
  # companionship (مختلف في صحبته ...) is NOT overridden and follows rank_no.
  # See DECISIONS.md D33.
  label_overrides: ["صحابي صغير", "صحابية صغيرة"]

# Pseudo-narrators: rawis rows with rank IS NULL and rank_no = 12 that are not
# people. The audit asserts this list equals that set exactly.
placeholders:
  30002: {role: gap, kind: irsal,  name: "موضع إرسال"}   # companion dropped (mursal)
  30000: {role: gap, kind: inqita, name: "موضع انقطاع"}  # break inside the chain (munqati')
  30001: {role: gap, kind: taliq,  name: "موضع تعليق"}   # compiler omitted the start (mu'allaq)
  1131:  {role: mubham, kind: mubham, name: "اسم مبهم"}  # an unnamed person ("a man", "a shaykh")

# Kappa thresholds: a narrator is kept in the threshold subgraph iff its
# ordinal >= min_ordinal. Columns are named by threshold.
thresholds:
  all:          {min_ordinal: 0,  note: "everyone, including undescribed and unnamed narrators"}
  above_matruk: {min_ordinal: 4,  note: "Taqrib levels 1-9: drops matruk, muttaham, kadhdhab/wadda' (the severely-weak band)"}
  saduq_up:     {min_ordinal: 9,  note: "Taqrib levels 1-4: saduq and above"}
  thiqa_up:     {min_ordinal: 10, note: "Taqrib levels 1-3: thiqa and above"}

# The source's hukm code scale (hadiths.matn_no, sanads.matn_no, meaning_groups.matn_no),
# verified in the audit. Labels are quoted from the source, not issued by itibar.
hukm_codes:
  -1: "بدون سند"
  0: "صحيح"
  1: "حسن"
  2: "ضعيف"
  3: "شديد الضعف"
  4: "متهم بالوضع"
  5: "موضوع"
  6: "موقوف"
  7: "مقطوع"
  8: "بدن شواهد أوسند"

