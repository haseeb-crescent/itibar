[project]
name = "itibar"
version = "0.1.0"
description = "Corpus-scale isnad-bundle analysis: structure and mechanically derived grades for every hadith meaning group."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT (code); CC-BY-4.0 (derived data)" }
authors = [{ name = "Haseeb Chaudhry" }]
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "numpy>=1.26",
    "pandas>=2.2",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "huggingface_hub>=0.25",
]

[project.scripts]
itibar = "itibar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itibar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gold: gold-set structural expectations",
    "gate: corpus-level agreement gates",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6"]
