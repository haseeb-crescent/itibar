# Gold set: hadith whose isnad structure is classically documented.
#
# Each entry states a structural expectation, the classical source for it, and
# the scope it is evaluated on. A scope selects chains of the meaning group
# (never edits them):
#   companion: rawi id   keep chains whose last narrator is this companion
#   threshold: name      evaluate kappa / cut vertices on that threshold subgraph
#
# known_deviations lists, chain by chain, every in-scope chain that contradicts
# the documented structure (it misses one of `deviation_key`'s narrators), with
# the reason found on inspection. The test asserts that this list is EXACTLY the
# set of contradicting chains in the data, then evaluates `expect` on the scope
# with those chains removed. So the test fails if the machinery changes the
# structure, if the data gains or loses a contradicting chain, or if the
# documented structure does not hold on the remaining chains.
#
# A deviation caused by cross-name misresolution (a different full name resolved
# to the wrong person) carries `misresolution: {resolved, intended}`; a suspected
# one not yet in the deviation lists is recorded as `candidate_misresolution` for
# the name-resolution work of a later bucket. reports/audit.md (section 8.4) checks
# each against the continuity rule. Neither key changes what the test asserts.
#
# Node ids: r<rawi_id>. Narrator names are given for the reader; ids are what
# the test checks. Source attributions name the work; `confidence` says how
# sure the editor is that the cited work makes this exact claim (medium =
# verify against the printed text before citing in the paper).
#
# Mutawatir entries (al-Kattani, Nazm al-Mutanathir min al-Hadith al-Mutawatir)
# assert only kappa_all > 1 and at least ten companions on path (al-Suyuti's
# ten-companion criterion in al-Azhar al-Mutanathira); `companions` counts
# companions narrating directly from the Prophet on an unbroken route to a book.; the kappa at every
# threshold is recorded by `make gold` in reports/gold.md, not asserted.

entries:

# ---------------------------------------------------------------- gharib / fard

- id: innama-al-amal
  group_id: 319
  title: "إنما الأعمال بالنيات — through 'Umar"
  class: gharib
  source:
    - {work: "Nuzhat al-Nazar fi Tawdih Nukhbat al-Fikar", author: "Ibn Hajar al-'Asqalani", confidence: high,
       claim: "gharib: 'Umar alone from the Prophet, 'Alqama alone from 'Umar, Muhammad b. Ibrahim al-Taymi alone from 'Alqama, Yahya b. Sa'id al-Ansari alone from al-Taymi; many from Yahya"}
    - {work: "Muqaddimat Ibn al-Salah (naw' 13, al-shadh; naw' 31, al-gharib)", author: "Ibn al-Salah", confidence: high,
       claim: "cited as the standard sound fard"}
  scope: {companion: 5913, threshold: all}
  deviation_key: [r5913, r5719, r6796, r8272]
  known_deviations:
    - reason: "homonym misresolution: 'Yahya b. Sa'id' under al-Taymi (d. 119 in the data, 120 in Taqrib) resolved to al-Qattan (r8271, b. 120, layer 9); the student of al-Taymi is al-Ansari"
      sanad_ids: [320050, 320051, 320052, 320053, 320054, 320055]
      misresolution: {resolved: r8271, intended: r8272}
    - reason: "dropped link: 'Alqama missing between 'Umar and al-Taymi (al-Humaydi's chain; al-Humaydi's own Musnad has 'Alqama)"
      sanad_ids: [349231, 349232]
    - reason: "route from al-Taymi via Muhammad b. 'Amr b. 'Alqama al-Laythi (r7225, Taqrib level 5), against the documented tafarrud of Yahya; absent at saduq_up and above"
      sanad_ids: [469869, 483205, 523109, 523110, 540745]
    - reason: "route from 'Alqama via Muhammad b. Sulayman b. Abi Hathma (r7002, Taqrib level 6, Tarikh Dimashq), against the documented tafarrud of al-Taymi; absent at saduq_up and above"
      sanad_ids: [519989]
  expect:
    kappa_eq: {all: 1, thiqa_up: 1}
    cut_vertices_eq: {all: [r5913, r5719, r6796, r8272], thiqa_up: [r5913, r5719, r6796, r8272]}
    single_strand_include: [r5913, r5719, r6796]        # P -> 'Umar -> 'Alqama -> al-Taymi -> Yahya: four links, one strand
    min_students: {r8272: 25}                            # "a wide fan below him"
    death_year: {r8272: 143}                             # terminus of the cut vertex Yahya b. Sa'id al-Ansari
  notes: >
    Whole group 319 also carries routes via Abu Sa'id al-Khudri, Anas and Ibn 'Abbas that the
    classical sources do not count; its whole-group kappa is recorded in reports/gold.md.

