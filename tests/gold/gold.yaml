# ================================================================ bucket 2
#
# The entries below test the corroborated grade (derive v2), the number class,
# the qara'in flags and the list matching. They never change an entry above.
# `scope_from: <id>` reuses another entry's scope and documented deviations.
# chain_v2 selects the chains carrying `path` (companion first, then down the
# chain, consecutive), takes the best of them under v2, and checks its weakest
# narrator (Taqrib level = rawis.rank_no) and its v2 rule and code per ruleset.
# Pages are Shamela page ids; printed page labels are in the quotes.

# ---------------------------------------------------------------- corroboration

- id: siwak-muhammad-b-amr
  group_id: 121
  title: "لولا أن أشق على أمتي لأمرتهم بالسواك — through Muhammad b. 'Amr b. 'Alqama"
  class: hasan-raised-by-other-routes
  source:
    - {work: "Muqaddimat Ibn al-Salah (naw' 2, al-hasan), ed. 'Itr p. 35", author: "Ibn al-Salah", confidence: high,
       url: "https://shamela.ws/book/22870/32",
       claim: "Muhammad b. 'Amr is known for truthfulness but not for precision; his hadith is hasan, and as it is also narrated by other routes the chain reaches the level of sahih"}
    - {work: "Taqrib al-Tahdhib, introduction (level 5)", author: "Ibn Hajar", confidence: high,
       url: "https://shamela.ws/book/127715/52", claim: "level 5: صدوق سيء الحفظ / يهم / له أوهام"}
  scope: {threshold: all}
  expect:
    chain_v2:
      path: [r4396, r4903, r7225]          # Abu Hurayra -> Abu Salama -> Muhammad b. 'Amr al-Laythi (rank_no 5, صدوق له أوهام)
      weakest: {node: r7225, level: 5}
      ibn_hajar: {code: 1, rule: hasan_li_ghayrihi}
      ibn_al_salah: {code: 0, rule: sahih_li_ghayrihi}
  notes: >
    16 chains of group 121 carry Abu Hurayra -> Abu Salama -> Muhammad b. 'Amr. The witnessing route
    (attested chain, e.g. sanad 1037) shares Abu Hurayra but not Abu Salama: mutaba'a qasira. Under
    ibn_hajar level 5 is a light defect, repaired to hasan li-ghayrihi; under ibn_al_salah it is hasan
    on its own and an independent hasan-or-better route raises it to sahih li-ghayrihi, as in his text.

- id: sandals-asim-b-ubaydallah
  group_id: 2031
  title: "أرضيت من نفسك ومالك بنعلين — through 'Asim b. 'Ubaydallah"
  class: hasan-li-ghayrihi-witnesses-outside-the-group
  source:
    - {work: "al-Nukat 'ala Kitab Ibn al-Salah 1/388-389", author: "Ibn Hajar", confidence: high,
       url: "https://shamela.ws/book/8316/363",
       claim: "an example of hasan from a poor-memory narrator: al-Tirmidhi called it hasan 'لمجيئه من غير وجه'"}
    - {work: "Jami' al-Tirmidhi no. 1113 (Shamela 7895)", author: "al-Tirmidhi", confidence: high,
       url: "https://shamela.ws/book/7895/1910",
       claim: "after the hadith: وفي الباب عن عمر وأبي هريرة وسهل بن سعد وأبي سعيد وأنس وعائشة وجابر وأبي حدرد (that edition reads حسن صحيح)"}
    - {work: "Taysir Mustalah al-Hadith p. 67", author: "Mahmud al-Tahhan", confidence: high,
       url: "https://shamela.ws/book/8681/58", claim: "the textbook example of al-hasan li-ghayrihi"}
  scope: {threshold: all}
  expect:
    chain_v2:
      path: [r4095, r4879, r4069]          # 'Amir b. Rabi'a -> 'Abdullah b. 'Amir -> 'Asim b. 'Ubaydallah (rank_no 8, ضعيف الحديث)
      weakest: {node: r4069, level: 8}
      ibn_hajar: {code: 2, rule: daif}      # PR 6 default shahid_scope group: no witness inside the meaning group
      ibn_al_salah: {code: 2, rule: daif}
      alt_siblings: {code: 1}               # the siblings variant (PR 5's default): repaired by a shahid
      alt_siblings_strict: {code: 2}        # at the strict floor 0.38 the sibling pair (0.333) does not count
  classical_claim: "hasan li-ghayrihi (corroboration fires)"
  classical_claim_holds_in_group: false
  classical_claim_holds_with_siblings: true
  notes: >
    Inside the meaning group corroboration cannot fire: 47 of its 51 chains pass through 'Asim, and the
    other four carry a different report (Maymuna bint Kardam, through unnamed persons); the default
    (shahid_scope group since PR 6, D58 amended) keeps code 2, PR 4's in-group finding (D54). The routes al-Tirmidhi relies on are his "fi al-bab"
    reports from other companions, filed by the source as other meaning groups under the same topic
    (أقل المهر). With shahid_scope siblings (D58) the witness is sanad 261755 of group 763 (Sahl b. Sa'd's
    report, Musannaf Ibn Abi Shayba): «زوج رجلا امرأة على أن يعلمها سورة من القرآن», a man married for a
    minimal dowry, approved — al-Tirmidhi's Sahl b. Sa'd. Its matn overlap with the 'Asim chain's matn is
    0.333 (idf-weighted Dice), above the floor 0.32 and below the strict variant's 0.38 (code 2 there).
