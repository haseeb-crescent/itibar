       claim: "from Ibn 'Umar by 'Ikrima b. Khalid (Bukhari, Muslim), Sa'd b. 'Ubayda and Muhammad b. Zayd (Muslim)"}
    - {work: "Nuzhat al-Nazar (definition of al-mashhur: more than two routes at every layer, short of tawatur)",
       author: "Ibn Hajar al-'Asqalani", confidence: high, claim: "definition"}
  scope: {companion: 4967, threshold: all}
  expect:
    pcl_include: {3: [r4967]}
    students_include: {r4967: [r5699, r3256, r6977]}
    min_students: {r4967: 3}

- id: mighfar-mutabaat
  group_id: 376
  title: "دخل مكة وعلى رأسه المغفر — Malik's tafarrud from al-Zuhri, and its mutaba'at"
  class: gharib-with-mutabaat
  source:
    - {work: "Muqaddimat Ibn al-Salah (naw' 13)", author: "Ibn al-Salah", confidence: high,
       claim: "Malik alone from al-Zuhri"}
    - {work: "al-Taqyid wa al-Idah; al-Nukat 'ala Kitab Ibn al-Salah", author: "al-'Iraqi; Ibn Hajar", confidence: medium,
       claim: "followed (mutaba'a) by Ibn Akhi al-Zuhri, Abu Uways, Ma'mar and al-Awza'i, among others"}
  scope: {companion: 720, threshold: all}
  expect:
    students_include: {r7272: [r6659, r7133, r4916, r7633]}   # al-Zuhri -> Malik, Ibn Akhi al-Zuhri, Abu Uways, Ma'mar
    not_cut_vertex: {all: [r6659]}

