  quote: 'سماك بن حرب بن أوس بن خالد بن ثعلبة الذهلي البكري أبو المغيرة معدود في الكوفيين عن إبراهيم بن يزيد النخعي وأنس بن مالك وجابر بن سمرة وسعيد بن جبير وغيرهم وعنه سفيان الثوري وشعبة بن الحجاج وأبو
    عوانة الوضاح وغيرهم قال يحيى بن معين ثقة وقال أبو حاتم صدوق ثقة وقال علي بن المديني له نحو مائتي حديث وقال سماك بن حرب أدركت ثمانين من أصحاب النبي صلى الله عليه وسلم وكان قد ذهب بصري فدعوت الله فرد
    علي بصري قال الذهبي ساء حفظه وقال محمد بن عبد الله بن عمار يقولون أنه كان يغلط ويختلفون في حديثه وقال يعقوب روايته عن عكرمة مضطربة وهو في غير عكرمة صالح ومن سمع منه قديما مثل سفيان وشعبة فحديثه عنه
    صحيح مستقيم [قال يعقوب: وقول ابن المبارك فيه إنما نراه فيمن سمع منه بأخرة (٤) .] روى له مسلم وأبو داود والترمذي والنسائي وابن ماجة وتوفي سنة ثلاث وعشرين ومئة'
  status: auto
  confirmed_by: auto
  note: ''
