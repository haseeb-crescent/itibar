- rule_id: 1419:from_shaykh:1
  rawi_id: 1419
  narrator: الربيع بن يحيى المرئي
  kind: from_shaykh
  condition: سفيان ثوري
  condition_ids: '3436'
  region: ''
  effect: defect:light
  observable: true
  source_book: تحرير تقريب التهذيب
  citation: '[تحرير تقريب التهذيب (١/ ٣٩٥)](https://shamela.ws/book/127715/387)'
  quote: '١٩٠٣ - الربيعُ بن يحيى بن مِقْسَم الأشْناني، بضم الألف وسُكونِ المُعْجَمة، أبو الفَضْل البصري: صدوقٌ له أوهامٌ، من كبار العاشرة، مات سنة أربع وعشرين. خ د.

    • بل: ثقةٌ إلا في روايته عن سفيان الثوري وشعبة، فهي ضعيفة، فقد قال أبو حاتم: ثقةٌ ثبتٌ. وذكره ابنُ حبان في "الثقات"، ونَقَلَ ابنُ حجر عن الدارقطني أنه قال: "يخطئ في حديثه عن الثوري وشعبة"، ونَقَلَ البرقاني
    عن الدارقطني أنه قال: "ضعيفٌ ليس بالقوي يخطئ كثيرًا". وقال ابن حجر: ما أخرج عنه البخاريُّ إلَّا من حديثه عن زائدة فقط. فإذا صَحَّ نقلُ ابن حجر عن الدارقطني - وهو صحيحٌ إن شاء الله - فهذا يعني أن الدارقطني
    قيَّد ضعفه بروايته عن سفيان وشعبة، أما في روايته عن الآخرين فهو ثقة، والله أعلمُ. وهو بكل حال شيخ البخاري في "الصحيح".'
  status: auto
  confirmed_by: auto
  note: ''
