- rule_id: 3281:ikhtilat_after:1
  rawi_id: 3281
  narrator: سعيد بن أبي عروبة العدوي
  kind: ikhtilat_after
  condition: heard after
  condition_ids: 5288 8160
  region: ''
  effect: defect:light
  observable: true
  source_book: تحرير تقريب التهذيب
  citation: '[تحرير تقريب التهذيب (٢/ ٣٨)](https://shamela.ws/book/127715/468)'
  quote: '٢٣٦٥ - سعيدُ بن أبي عَرُوبة: مِهْران اليَشْكُري مولاهم، أبو النضر البصري: ثقةٌ حافظٌ له تصانيف، كثير التدليسِ، واختَلَط، وكان من أثبت الناس في قَتادةَ، من السادسة، مات سنة ست - وقيل: سبع - وخمسين.
    ع.

    • قلنا: أما وصفُه بكثرة التدليس هنا، فمناقضٌ لما ذكره في "طبقات المدلسين"، فقد ذكره في الطبقة الثانية التي احتمل الأئمةُ تدليسهم، وأخرجوا لهم في الصحيح لإمامتهم وقِلَّة تدليسهم، مع أنهم قد ذكروا جماعة
    روى عنهم ولم يسمع منهم وفيهم كثرة، وما ندري هل مثل هذا يُسَمَّى تدليسًا أم إرسالًا؟

    أما اختلاطه فنحن ذاكرون هنا من روى عنه قبل الاختلاط وهم:

    أسباط بن محمد، وإسماعيل بن عُلَيَّة، وأبو أسامة حماد بن أسامة، وخالد بن الحارث، وروح بن عُبادة، وسرار بن مُجشِّر، وسفيان بن حبيب، وسفيان الثوري، وشبيب بن إسحاق، وشعبة بن الحجاج، وعبد الأعلى السامي،
    وعبد الله بن بكر بن حبيب السَّهْمي، وعبد الله بن المبارك، وعبد الوهَّاب بن عطاء الخفاف، وعيسى بن يونس، وعَبْدة بن سليمان، ومحمد بن بشر، ومحمدبن بكر البُرْساني، '
  status: auto
  confirmed_by: auto
  note: ''
