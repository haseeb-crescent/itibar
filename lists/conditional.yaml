- rule_id: 4490:from_shaykh:1
  rawi_id: 4490
  narrator: عبد الرحمن بن مغراء الدوسي
  kind: from_shaykh
  condition: اعمش
  condition_ids: '3629'
  region: ''
  effect: defect:light
  observable: true
  source_book: تحرير تقريب التهذيب
  citation: '[تحرير تقريب التهذيب (٢/ ٣٤٩)](https://shamela.ws/book/127715/777)'
  quote: '٤٠١٣ - عبدُ الرحمن بن مَغْراء، بفتح الميم وسكون المعجمة ثم راء، الدَّوْسي، أبو زهير الكوفي، نزيل الريِّ: صدوقٌ تُكلم في حديثه عن الأعمش، من كبار التاسعة، مات سنة بضع وتسعين. بخ ٤.

    • هو: صدوقٌ حسمن الحديث، إلا في روايته عن الأعمش، فهو ضعيف، قال أبو زرعة: صدوقٌ، وقال ابن معين والذهبي: لم يكن به بأس، ووثقه أبو خالد الأحمر. لكن قال علي بن المديني: ليس بشيء، كان يروي عن الأعمش ستَّ
    مئة حديث، تركناه، لم يكن بذاك، وقال ابن عدي: "وهذا الذي قاله علي بن المديني هو كما قال، إنما أنكرت على أبي زهير هذا، أحاديث يرويها عن الأعمش لا يُتابعه الثقات عليها، وله عن غير الأعمش غرائب، وهو من
    جملة الضعفاء الذين يُكتب حديثهم". وقال أبو أحمد الحاكم: حدث بأحاديث لم يتابع عليها.'
  status: auto
  confirmed_by: auto
  note: ''
- rule_id: 4591:unobservable:1
  rawi_id: 4591
  narrator: عبد العزيز بن محمد الدراوردي
  kind: unobservable
  condition: book_vs_memory
  condition_ids: ''
  region: ''
  effect: none
  observable: false
  source_book: تحرير تقريب التهذيب
  citation: '[تحرير تقريب التهذيب (٢/ ٣٧١)](https://shamela.ws/book/127715/799)'
  quote: '٤١١٩ - عبد العزيز بن محمد بن عبيد الدَّراوَرْدِي، أبو محمد الجهني مولاهم، المدني: صدوق كان يُحدث من كتب غيره فَيُخطِئُ، قال النسائي: حديثُه عن عُبيد الله العمري منكر، من الثامنة، مات سنة ست -
    أو سبع - وثمانين. ع.

    • بل: ثقة، وثقه مالك، وابن معين، ويعقوب بن سفيان (المعرفة ١/ ٣٤٩)، وابن سعد، والعجلي، وذكره ابن حبان في (الثقات). وقال النسائي: ليس بالقوي، وقال في موضع آخر: ليس به بأس. وقال أبو زرعة: سيئ الحفظ، فربما
    حدث من حفظه الشيء فيخطئ، ولكنه فضله في موضع آخر على فليح بن سليمان وابن أبي الزناد.

    وكتاب الدراوردي صحيح، كما قال الإمام أحمد وغيره، لكنه كان يغلط'
  status: auto
  confirmed_by: auto
  note: ''
- rule_id: 5033:ikhtilat_after:1
  rawi_id: 5033
  narrator: عبد الله بن لهيعة الحضرمي
  kind: ikhtilat_after
  condition: heard after
  condition_ids: ''
  region: ''
  effect: defect:light
  observable: true
  source_book: تحرير تقريب التهذيب
  citation: '[تحرير تقريب التهذيب (٢/ ٢٥٨)](https://shamela.ws/book/127715/686)'
  quote: '٣٥٦٣ - عبدُ الله بن لَهِيعة، بفتح اللام وكسر الهاء، ابن عُقْبة الحضرمي، أبو عبد الرحمن المصري، القاضي: صدوق، من السابعة، خَلَّطَ بعد احتراق كُتُبِه، ورواية ابن المبارك وابن وَهْب عنه أعدلُ من
    غيرهما، وله في مسلم بعضُ شيءٍ مقرونٌ، مات سنة أربع وسبعين، وقد ناف على الثمانين. م د ت ق.

    • بل: ضعيفٌ يُعتَبر به، وحديثه صحيح إذا روى عنه العبادلة: ابن المبارك، وابن وهب، وابن يزيد المقرئ، وابن مسلمة القعنبي، فإنهم كانوا يتتبعون أصوله فيكتبون منها. وقد أخرج له البخاري في "صحيحه" من رواية
    المقرئ وابن وهب عنه مقرونًا، لكنه أبهمه في جميع هذه المواضع بقوله: "عن حيوة وغيره"، و"أخبرني فلان وحيوة"، و"عن عبد الرحمن بن شريح وغيره " ... الخ. وروى له مسلم من رواية ابن وهب عنه مقرونًا بعمرو بن
    الحارث. وروى النسائي أحاديث كثيرة من رواية ابن وهب وغيره يقول فيها: "عن عمرو بن الحارث، وذكر آخر"، و"عن فلان، وذكر آخر"، ونحو ذلك، وجاء كثير من ذلك مُبَيَّنًا في رواية غيره أنه ابن لهيعة. وكل هذا يشير
    إلى حسن رواية العباد'
  status: auto
  confirmed_by: auto
  note: ''
