  quote: ٧٩٨٥- أبو بكر ابن عياش بتحتانية ومعجمة ابن سالم الأسدي الكوفي المقرىء الحناط بمهملة ونون مشهور بكنيته والأصح أنها اسمه وقيل اسمه محمد أو عبد الله أو سالم أو شعبة أو رؤبة أو مسلم أو خداش أو مطرف
