- rule_id: 3290:ikhtilat_after:1
  rawi_id: 3290
  narrator: سعيد بن إياس الجريري
  kind: ikhtilat_after
  condition: heard after
  condition_ids: ''
  region: ''
  effect: defect:light
  observable: true
  source_book: الكواكب النيرات
  citation: '[الكواكب النيرات](https://shamela.ws/book/309/129)'
  quote: 'سعيد بن إياس أبو مسعود الجريري بضم الجيم وفتح الراء المهملة معدود في البصريين

    عن ثمامة بن حزن القشيري وحبان بن عمير القيسي وعبد الله بن بريدة وأبي الطفيل ويزيد بن الشخير وغيرهم وعنه إسماعيل بن علية وسفيان الثوري وعبد الله بن المبارك وشعبة ويزيد بن هارون وغيرهم وهو ثقة احتج به
    الشيخان وأطلق يحيى بن معين والنسائي القول بتوثيقه وقال أحمد بن حنبل محدث أهل البصرة قال أبو حاتم تغير حفظه قبل موته فمن كتب عنه قديما فهو صالح وهو حسن الحديث وقال كهمس أنكرنا الجريري أيام الطاعون وقال
    النسائي ثقة أنكر أيام الطاعون وقال يزيد بن هارون سمعت منه سنة اثنتين وأربعين ومئة وهى أول سنة دخلت البصرة ولم ننكر منه شيئا وكان قيل لنا أنه اختلط وعنه ربما ابتدأنا الجريري وكان قد أنكر وقال بن عدى
    لا نكذب والله سمعنا منه وكان قد اختلط وقال بن حبان كان قد اختلط قبل أن يموت بثلاث سنين قال وقد رآه يحيى القطان وهو مختلط ولم يكن اختلاطه فاحشا قال الأبناسى وممن سمع منه قبل التغيير شعبة وسفيان الثوري
    والحمادان وإسماعيل بن عل'
  status: auto
  confirmed_by: auto
  note: ''
