    على فاطمة بنت المنجا عن عيسى بن عبد الرحمن المطعم قرئ على كريمة بنت عبد الوهاب وأنا أسمع عن محمد بن أحمد بن عمرو الباعنان أنا أبو عمرو بن أبي عبد الله بن مندة أنا أبو عمرو عبد الله بن محمد بن أحمد بن
    عبد الوهاب املاء ثنا أبو عبد الله أحمد بن يونس بن إسحاق ثنا أحمد بن محمد الاصفر حدثني الثفيلي ثنا مسكين بن بكير ثنا شعبة قال سألت عمرو بن دينار عن رفع الايدي عند رؤية البيت فقال قال أبو قزعة حدثني مهاجر
    المكي أنه سأل جابر بن عبد الله رضي الله تعالى عنهما أكنتم ترفعون أيديكم عند رؤية البيت فقال قد كنا مع رسول الله صلى الله عليه وسلم فهل فعلنا ذلك قال الاصفر ألقيته على أحمد بن حنبل فاستعادنيه فاعدته
    عليه فقال ما كنت أظن أن شعبة يدلس حدثنا محمد بن جعفر ثنا شعبة عن أبي قزعة بأربعة أحاديث هذا أحدها لم يذكر فيه عمرو بن دينار قلت اسم أبي قزعة سويد بن حجر وهذا شئ قاله الامام أحمد بن حنبل ظنا والذي عندي
    أن شعبة لم يدلسه بل كان يسأل عمرو بن دينار فحدثه بهذا ثم لقي أبا قزعة فسأله عنه فحدثه به والدليل على ذلك انه صرح بسماعة منه لهذا الحديث فيما رواه أبو داود في السنن عن يحيى بن معين عن محمد بن جعفر غندر
    عن شعبة سمعت أبا قزعة به وكيف يظن بشعبة التدليس وهو القائل لان آخر من السماء أحب الي من أن أقول
