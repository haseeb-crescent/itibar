  note: عمرو بن شعيب بن محمد بن عبد الله بن عمرو بن العاص السهمي تابعي صغير مشهور مختلف فيه والاكثر على أنه صدوق في نفسه وحديثه عن غير أبيه عن جده قوي قال بن معين إذا حدث عن أبيه عن جده فهو كتاب ومن هنا
    جاء ضعفه إذا حدث عن سعيد بن المسيب وسليمان بن يسار وعروة فهو ثقة وقال أبو زرعة روى عنه الثقات وانما أنكروا عليه كثرة روايته عن أبيه عن جده وقالوا إنما سمع أحاديث يسيرة وأخذ صحيفة كانت عنده فرواها وعامة
    المناكير في حديثه من رواية الضعفاء عنه وهو ثقة في نفسه إنما تكلم فيه بسبب كتاب كان عنده وقال بن أبي خيثمة سمعت هارون بن معروف يقول لم يسمع عمرو من أبيه شيئا إنما وجده في كتاب أبيه وقال بن عدي روى عنه
    أئمة الناس وثقاتهم وجماعة من الضعفاء الا ان أحاديثه عن أبيه عن جده مع احتمالهم إياه لم يدخلوها في صحاح ما خرجوا وقال هي صحيفة قلت فعلى مقتضى قول هؤلاء يكون تدليسا لانه ثبت سماعه من أبيه وقد حدث عنه
    بشئ كثير مما لم يسمعه منه مما أخذه عن الصحيفة بصيغة عن وهذا أحد صور التدليس والله أعلم
