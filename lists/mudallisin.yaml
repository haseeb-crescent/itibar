  name: سفيان بن عيينة الهلالي الكوفي ثم المكي
  note: 'سفيان بن عيينة الهلالي الكوفي ثم المكي الامام المشهور فقيه الحجاز في زمانه كان يدلس لكن لا يدلس الا عن ثقة وادعى بن حبان بأن ذلك كان خاصا ووصفه النسائي وغيره بالتدليس وذكر البرهان الحلبي لسفيان
    بن عيينة ترجمتين الاول هذا والثاني سفيان بن عيينة الهلالي مولى مسعر بن كدام من أسفل ليس بشئ كان يدلس قال البرهان هذا آخر غير الاول قلت: ليس كما ظن فإن ابن عيينة مولى بني هلال وقد ذكر الذهبي في فوائد
    رحلته أنه لما اجتمع بابن دقيق العيد سأله من أبو محمد الهلالي فقال سفيان بن عيينة فأعجبه استحضاره وانما نسب لمسعر لان مسعرا من بني هلال صليبة ولعل العجلي إنما قال فيه ليس بشئ لامر آخر غير التدليس لعله
    الاختلاط ثم راجعت أصل الثقات للعجلي فوجدته قال ما نصه سفيان بن عيينة'
