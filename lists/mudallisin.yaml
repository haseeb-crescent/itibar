  note: شعيب بن محمد بن عبد الله بن عمرو بن العاص يروى عن جده روى عنه ابنه عمرو ومشيخته مشهورة وروى عنه أيضا ولدله آخر اسمه عمير بضم العين وثابت البناني وعطاء الخراساني وغيرهم وجل ما يرو عنه عن ولده عمرو
    وستأتي ترجمته واختلفوا في سماعه من جده فجزم بأنه سمع منه بن المديني والبخاري والدارقطني وأحمد بن سعيد الدارمي وأبو بكر بن زياد النيسابوري وقال أحمد بن حنبل أراه سمع منه وجزم أنه لم يسمع منه بن معين
    وقال انه وجد كتاب عبد الله بن عمر فحدث منه وقال بن حبان من قال انه سمع من جده فليس ذلك بصحيح قلت وقد صرح بسماعه من جده في أحاديث أنه سمع من جده قليلة فان كان الجميع صحيحة وجدت صورة التدليس
