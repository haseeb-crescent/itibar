meta:
  work: تعريف أهل التقديس بمراتب الموصوفين بالتدليس (Tabaqat al-Mudallisin)
  author: Ibn Hajar al-'Asqalani (d. 852/1449)
  source: 'Shamela book 1186, ed. ''Asim b. ''Abdallah al-Qaryuti (Amman: Maktabat al-Manar, 1403/1983), fetched page by page into lists/source/mudallisin_1186.jsonl; the editor numbers the 152 names serially
    across the tiers. His appendix of 22 further names (pages 58-66) is not Ibn Hajar''s and is not included.'
  tiers:
    1: من لم يوصف بذلك الا نادرا
    2: من احتمل الائمة تدليسه وأخرجوا له في الصحيح لامامته وقلة تدليسه في جنب ما روى كالثوري أو كان لا يدلس الا عن ثقة كإبن عيينة
    3: من أكثر من التدليس فلم يحتج الائمة من أحاديثهم الا بما صرحوا فيه بالسماع ومنهم من رد حديثهم مطلقا ومنهم من قبلهم كأبي الزبير المكي
    4: من اتفق على أنه لا يحتج بشئ من حديثهم الا بما صرحوا فيه بالسماع لكثرة تدليسهم على الضعفاء والمجاهيل كبقية بن الوليد
    5: من ضعف بأمر آخر سوى التدليس فحديثهم مردود ولو صرحوا بالسماع الا أن يوثق من كان ضعفه يسيرا كابن لهيعة
  tiers_url: https://shamela.ws/book/1186/9 (tiers 1-3), https://shamela.ws/book/1186/10 (tiers 4-5)
  count_stated: مائة واثنان وخمسون نفسا (152)
  count_parsed: 152
  per_tier_parsed:
    1: 33
    2: 33
    3: 50
    4: 12
    5: 24
  per_tier_printed:
    1: 33
    2: 33
    3: 50
    4: 12
    5: 24
  fields:
    number: the editor's serial number
    tier: Ibn Hajar's tier (المرتبة), 1-5
    sigla: Taqrib sigla before the name, as printed (ع = the Six Books)
    name: the name as printed, up to the first descriptive word (a heuristic cut; `note` keeps the whole entry)
    note: the whole entry after the sigla, as printed
entries:
- number: 1
  tier: 1
  sigla: ''
  name: أحمد بن عبد الله بن أحمد بن إسحاق الاصبهاني الحافظ أبو نعيم
  note: أحمد بن عبد الله بن أحمد بن إسحاق الاصبهاني الحافظ أبو نعيم صاحب التصانيف الكثيرة الشائعة منها حلية الاولياء ومعرفة الصحابة والمستخرجين على الصحيحين كانت له إجازة من أناس أدركهم ولم يلقهم فكان يروى
    عنهم بصيغة أخبرنا ولا يبين كونها إجازة لكنه كان إذا حدث عن من سمع منه يقول حدثنا سواء كان ذلك قراءة أو سماعا وهو اصطلاح له تبعه عليه بعضهم وفيه نوع تدليس بالنسبة لمن لا يعرف ذلك قال الخطيب رأيت لابي
    نعيم أشياء يتساهل فيها منها أنه يطلق في الاجازة أخبرنا ولا يبين قال الذهبي هذا مذهب رآه أو نعيم وهو ضرب من التدليس وقد فعله غيره
  page_id: 14
  page_label: ص ١٨
  url: https://shamela.ws/book/1186/14
- number: 2
  tier: 1
  sigla: ''
  name: أحمد بن محمد بن إبراهيم بن حزم السمرقندي أبويحيى الكرابيسي
  note: أحمد بن محمد بن إبراهيم بن حزم السمرقندي أبويحيى الكرابيسي محدث مشهور سمع محمد بن نصر المروزي ومحمد بن إسحاق بن خزيمة قال الادريسي أكثر عن محمد بن نصر فاتهم في ذلك يعني أنه دلس عنه الاجازة فان له
    منه إجازة صحيحة قال الادريسي رأيتها بخط محمد بن نصر
  page_id: 14
  page_label: ص ١٨
  url: https://shamela.ws/book/1186/14
- number: 3
  tier: 1
  sigla: ''
  name: أحمد بن محمد بن يحيى بن حمزة الدمشقي
  note: أحمد بن محمد بن يحيى بن حمزة الدمشقي القاضي أكثر عن أبيه عن جده فقال أبو حاتم الرازي سمعته يقول لم أسمع من أبي شيئا وقال أبو عوانة الاسفرائيني أجاز له أبوه فروى عنه بذلك يعني ولم يبين كونها إجازة
  page_id: 15
  page_label: ص ١٩
  url: https://shamela.ws/book/1186/15
- number: 4
  tier: 1
  sigla: خ ٤
  name: إسحاق بن راشد الجزري
  note: إسحاق بن راشد الجزري كان يطلق حدثنا في الوجادة فإنه حدث عن الزهري فقيل له أني لقيته قال مررت ببيت المقدس فوجدت كتابا حكى ذلك الحاكم في علوم الحديث عن الاسماعيلي
  page_id: 15
  page_label: ص ١٩
  url: https://shamela.ws/book/1186/15
- number: 5
  tier: 1
  sigla: ع
  name: أيوب بن أبي تميمة السختياني
  note: أيوب بن أبي تميمة السختياني أحد الائمة متفق على الاحتجاج به رأى أنسا ولم يسمع منه فحدث عنه بعدة أحاديث بالعنعنة أخرجها عنه الدارقطني والحاكم في كتابهما
  page_id: 15
  page_label: ص ١٩
  url: https://shamela.ws/book/1186/15
- number: 6
  tier: 1
  sigla: ''
  name: أيوب بن النجار اليمامي صح أنه
  note: أيوب بن النجار اليمامي صح أنه قال لم أسمع من يحيى بن أبي كثير الا حديثا واحدا وقد روى عنه أكثر من حديث
  page_id: 15
  page_label: ص ١٩
  url: https://shamela.ws/book/1186/15
- number: 7
  tier: 1
  sigla: ع
  name: جرير بن حازم الازدي
  note: جرير بن حازم الازدي أحد الثقات وصفه بالتدليس يحيى الحماني في حديثه عن أبي حازم عن سهل بن سعد في صفة صلاة النبي صلى الله عليه وسلم
  page_id: 16
  page_label: ص ٢٠
  url: https://shamela.ws/book/1186/16
- number: 8
  tier: 1
  sigla: م ٤
  name: الحسين بن واقد المروزي
  note: الحسين بن واقد المروزي أحد الثقات من اتباع التابعين وصفه الدارقطني وأبو يعلى الخليلي بالتدليس
  page_id: 16
  page_label: ص ٢٠
  url: https://shamela.ws/book/1186/16
- number: 9
  tier: 1
  sigla: ع
  name: حفص بن غياث الكوفي
  note: حفص بن غياث الكوفي القاضي أحد الثقات من أتباع التابعين وصفه أحمد بن حنبل والدارقطني بالتدليس
  page_id: 16
  page_label: ص ٢٠
  url: https://shamela.ws/book/1186/16
- number: 10
  tier: 1
  sigla: ع
  name: خالد بن مهران الحذاء
  note: خالد بن مهران الحذاء أحد الاثبات المشهورين روى عن عراك بن مالك حديثا سمعه من خالد بن أبي الصلت عنه في استقبال القبلة في البول
  page_id: 16
  page_label: ص ٢٠
  url: https://shamela.ws/book/1186/16
- number: 11
  tier: 1
  sigla: ع
  name: زيد بن أسلم العمري مولاهم
  note: زيد بن أسلم العمري مولاهم روى عن بن عمر رضي الله تعالى عنهما في رد السلام بالاشارة قال بن عبيد قلت لانسان سله اسمعه من بن عمر فسأله فقال أما اني فكلمني وكلمته أخرجه البيهقي وفي هذا الجواب اشعار
    بأنه لم يسمع هذا بخصوصه منه مع أنه مكثر عنه فيكون قد دلسه
  page_id: 16
  page_label: ص ٢٠
  url: https://shamela.ws/book/1186/16
- number: 12
  tier: 1
  sigla: س
  name: سلمة بن تمام الشقري
  note: سلمة بن تمام الشقري من اتباع التابعين ذكره بن حبان في ثقات التابعين وذكر بن أبي حاتم ما يدل على أنه كان يدلس ولذلك قال العلائي في كتاب المراسيل كأنه مدلس
  page_id: 17
  page_label: ص ٢١
  url: https://shamela.ws/book/1186/17
- number: 13
  tier: 1
  sigla: د س ق
  name: شباك الضبي
  note: شباك الضبي صاحب إبراهيم النخعي مشهور من أهل الكوفة وصفه بالتدليس الدارقطني والحاكم
  page_id: 17
  page_label: ص ٢١
  url: https://shamela.ws/book/1186/17
- number: 14
  tier: 1
  sigla: ع
  name: طاوس بن كيسان اليماني
  note: طاوس بن كيسان اليماني التابعي المشهور ذكره الكرابيسي في المدلسين وقال أخذ كثيرا من علم بن عباس رضي الله تعالى عنهما ثم كان بعد ذلك يرسل عن بن عباس وروى عن عائشة فقال بن معين لا أراه سمع منها وقال
    أبو داود لا أعلمه سمع منها
  page_id: 17
  page_label: ص ٢١
  url: https://shamela.ws/book/1186/17
- number: 15
  tier: 1
  sigla: ع
  name: عبد الله بن زيد الجرمي أبو قلابة
  note: عبد الله بن زيد الجرمي أبو قلابة التابعي الشهير مشهور بكنيته وصغه بذلك الذهبي والعلائي
  page_id: 17
  page_label: ص ٢١
  url: https://shamela.ws/book/1186/17
- number: 16
  tier: 1
  sigla: م ٤
  name: عبد الله بن عطاء الطائفي
  note: عبد الله بن عطاء الطائفي نزيل مكة من صغار التابعين قضيته في التدليس مشهورة رواها شعبة عن أبي إسحاق السبيعي
  page_id: 18
  page_label: ص ٢٢
  url: https://shamela.ws/book/1186/18
- number: 17
  tier: 1
  sigla: ع
  name: عبد الله بن وهب المصري
  note: عبد الله بن وهب المصري الفقيه المشهور وصفه بذلك محمد بن سعد في الطبقات
  page_id: 18
  page_label: ص ٢٢
  url: https://shamela.ws/book/1186/18
- number: 18
  tier: 1
  sigla: خ م د س ق
  name: عبد ربه بن نافع أبو شهاب الحناط
  note: عبد ربه بن نافع أبو شهاب الحناط بالمهلمة والنون نزيل المدائن وثقة بن معين ولينه النسائي وأشار الخطيب في مقدمة تاريخه إلى أنه دلس حديثا
  page_id: 18
  page_label: ص ٢٢
  url: https://shamela.ws/book/1186/18
- number: 19
  tier: 1
  sigla: ''
  name: علي بن عمر بن مهدي الدارقطني الحافظ
  note: علي بن عمر بن مهدي الدارقطني الحافظ المشهور قال أبو الفضل بن طاهر كان له مذهب خفي في التدليس يقول قرئ على أبي القاسم البغوي حدثكم فلان فيوهم أنه سمع منه لكن لا يقول وأنا أسمع
  page_id: 18
  page_label: ص ٢٢
  url: https://shamela.ws/book/1186/18
- number: 20
  tier: 1
  sigla: ع
  name: عمرو بن دينار المكي
  note: عمرو بن دينار المكي الثقة المشهور التابعي أشار الحاكم في علوم الحديث إلى أنه كان يدلس
  page_id: 18
  page_label: ص ٢٢
  url: https://shamela.ws/book/1186/18
- number: 21
  tier: 1
  sigla: ع
  name: الفضل بن دكين بن زهير أبو نعيم الكوفي
  note: الفضل بن دكين بن زهير أبو نعيم الكوفي مشهور من كبار شيوخ البخاري وصفه أحمد بن صالح المصري بذلك
  page_id: 19
  page_label: ص ٢٣
  url: https://shamela.ws/book/1186/19
- number: 22
  tier: 1
  sigla: ع
  name: مالك بن أنس
  note: مالك بن أنس الامام المشهور يلزم من جعل التسوية تدليسا أن يذكره فيهم لانه كان يروى عن ثور بن زيد حديث عكرمة عن بن عباس وكان يحذف عكرمة وقع ذلك في غير ما حديث في الموطأ يقول عن ثور عن بن عباس ولا
    يذكر عكرمة وكذا كان يسقط عاصم بن عبد الله من إسناد آخر ذكر الدارقطني وأنكر بن عبد البر أن يكون تدليسا
  page_id: 19
  page_label: ص ٢٣
  url: https://shamela.ws/book/1186/19
- number: 23
  tier: 1
  sigla: ق س
  name: محمد بن إسماعيل بن إبراهيم بن المغيرة البخاري
  note: محمد بن إسماعيل بن إبراهيم بن المغيرة البخاري الامام وصفه بذلك أبو عبد الله بن مندة في كلام له فقال فيه اخرج البخاري قال فلان وقال لنا فلان وهو تدليس ولم يوافق بن مندة على ذلك والذي يظهر أنه يقول
    فيما لم يسمع وفيما سمع لكن لا يكون على شرطه أو موقوفا قال لي أو قال لنا وقد عرفت ذلك بالاستقراء من صنيعه
  page_id: 20
  page_label: ص ٢٤
  url: https://shamela.ws/book/1186/20
- number: 24
  tier: 1
  sigla: ''
  name: محمد بن عمران بن موسى المرزباني الكاتب الاخباري
  note: محمد بن عمران بن موسى المرزباني الكاتب الاخباري كان يطلق التحديث والاخبار في الاجازة ولا يبين ذكر ذلك الخطيب وغيره
  page_id: 21
  page_label: ص ٢٥
  url: https://shamela.ws/book/1186/21
- number: 25
  tier: 1
  sigla: ت ق
  name: محمد بن يزيد بن خنيس العابد
  note: محمد بن يزيد بن خنيس العابد قال بن حبان يعتبر حديثه إذا بين السماع في روايته
  page_id: 21
  page_label: ص ٢٥
  url: https://shamela.ws/book/1186/21
- number: 26
  tier: 1
  sigla: ''
  name: محمد بن يوسف بن مسدي الحافظ الاندلسي
  note: محمد بن يوسف بن مسدي الحافظ الاندلسي نزيل مكة في المائة السابعة وكان يدلس الاجازة وله معجم مشهور مات بمكة سنة ثلاث وستين وستمائة
  page_id: 21
  page_label: ص ٢٥
  url: https://shamela.ws/book/1186/21
- number: 27
  tier: 1
  sigla: م د س
  name: مخرمة بن بكير بن عبد الله بن الاشج
  note: مخرمة بن بكير بن عبد الله بن الاشج قال بن المديني سمع من أبيه قليلا وقيل لم يسمع منه شيئا وحدث عنه بالكثير وقال أبو داود ولم يسمع منه الا حديث الوتر ووصفه زكريا الساجي بالتدليس وقال مالك حلف لي
    مخرمة أنه سمع من أبيه وقال موسى بن سلمة قلت لمخرمة بن بكير سمعت من أبيك قال لم أدرك أبي وهذه كتبه.
  page_id: 21
  page_label: ص ٢٥
  url: https://shamela.ws/book/1186/21
- number: 28
  tier: 1
  sigla: ت
  name: مسلم بن الحجاج القشيري النيسابوري
  note: مسلم بن الحجاج القشيري النيسابوري الامام المشهور قال بن مندة انه كان يقول فيما لم يسمعه من مشائخه قال لنا فلان وهو تدليس ورد ذلك شيخنا الحافظ أبو الفضل بن الحسين وهو كما قال
  page_id: 22
  page_label: ص ٢٦
  url: https://shamela.ws/book/1186/22
- number: 29
  tier: 1
  sigla: ع
  name: موسى بن عقبة المدني
  note: موسى بن عقبة المدني تابعي صغير ثقة متفق عليه وصفه الدارقطني بالتدليس أشار إلى ذلك الاسماعيلي
  page_id: 22
  page_label: ص ٢٦
  url: https://shamela.ws/book/1186/22
- number: 30
  tier: 1
  sigla: ع
  name: هشام بن عروة بن الزبير بن العوام
  note: هشام بن عروة بن الزبير بن العوام تابعي صغير مشهور ذكره بذلك أبو الحسن القطان وأنكره الذهبي وابن القطان فان الحكاية المشهورة عنه أنه قدم العراق ثلاث مرات ففي الاولى حدث عن أبيه فصرح بسماعه وفي الثانية
    حدث بالكثير فلم يصرح بالقصة وهي تقتضي انه حدث عنه بما لم يسمعه منه وهذا هو التدليس
  page_id: 22
  page_label: ص ٢٦
  url: https://shamela.ws/book/1186/22
- number: 31
  tier: 1
  sigla: ع
  name: لاحق بن حميد أبو مجلز البصري
  note: لاحق بن حميد أبو مجلز البصري التابعي المشهور صاحب أنس مشهور بكنيته أشار بن أبي خيثمة عن بن معين إلى انه كان يدلس وجزم بذلك الدارقطني
  page_id: 23
  page_label: ص ٢٧
  url: https://shamela.ws/book/1186/23
- number: 32
  tier: 1
  sigla: ع
  name: يحيى بن سعيد بن قهد بالقاف بن قيس الانصاري المدني
  note: يحيى بن سعيد بن قهد بالقاف بن قيس الانصاري المدني تابعي صغير مشهور وصغه بذلك علي المديني فيما ذكره عبد الغني بن سعيد الازدي وكذا وصفه به الدارقطني
  page_id: 23
  page_label: ص ٢٧
  url: https://shamela.ws/book/1186/23
- number: 33
  tier: 1
  sigla: ع
  name: يزيد بن هارون الواسطي
  note: يزيد بن هارون الواسطي أحد الاعلام من أتباع التابعين قال ما دلست قط الا في حديث واحد فما بورك فيه
  page_id: 23
  page_label: ص ٢٧
  url: https://shamela.ws/book/1186/23
- number: 34
  tier: 2
  sigla: ''
  name: إبراهيم بن سليمان الافطس الدمشقي
  note: إبراهيم بن سليمان الافطس الدمشقي عن مكحول وغيره وعن يحيى بن حمزة وجماعة قال أبو حاتم لا بأس به وأشار البخاري إلى أنه كان يدلس
  page_id: 24
  page_label: ص ٢٧
  url: https://shamela.ws/book/1186/24
- number: 35
  tier: 2
  sigla: ع
  name: إبراهيم بن يزيد النخعي
  note: إبراهيم بن يزيد النخعي الفقيه المشهور في التابعين من أهل الكوفة ذكر الحاكم أنه كان يدلس وقال أبو حاتم لم يلق أحدا من الصحابة الا عائشة رضي الله تعالى عنها ولم يسمع منها وكان يرسل كثيرا ولا سيما
    عن بن مسعود وحدث عن أنس وغيره مرسلا
  page_id: 25
  page_label: ص ٢٨
  url: https://shamela.ws/book/1186/25
- number: 36
  tier: 2
  sigla: ع
  name: إسماعيل بن أبي خالد
