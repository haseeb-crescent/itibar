# Cross-group witness candidates read to set derive.corroboration.shahid_min_overlap
# (`python -m itibar.siblings inspect` regenerates reports/shahid_inspection.md from the
# two deterministic samples and these labels; DECISIONS D58).
#
# Each pair: a chain with light defects only and no witness in its own meaning group,
# and an attested light-or-better chain of a sibling group that avoids its positions to
# cover. Labels, read against Ibn Hajar's definition of the shahid («يشبهه في اللفظ
# والمعنى أو في المعنى فقط», Nuzhat al-Nazar):
#   same      the witness carries the chain's report, in wording or in meaning
#   partial   the witness carries one component of the chain's matn (a clause, one
#             item of a list) or the same topic with different content
#   different neither
# Sample 1: 30 pairs, three per decile of the idf-weighted overlap coefficient.
# Sample 2: 20 pairs, four per band of 0.06 of the idf-weighted Dice coefficient between
# 0.20 and 0.50 (bands fixed before reading).
