<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="How each hadith reached the books, chain by chain.">
<title>{{ title }} · itibar</title>
<link rel="stylesheet" href="{{ root }}assets/site.css">
<script type="module" src="{{ root }}assets/glossary.js"></script>
{% block head %}{% endblock %}
</head>
<body data-root="{{ root }}">
<a class="skip" href="#content">Skip to content</a>
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ root }}">itibar <span lang="ar" dir="rtl">اعتبار</span></a>
    <nav aria-label="Main">
      <a href="{{ root }}search/">Search</a><a href="{{ root }}browse/">Browse</a><a href="{{ root }}glossary/">Glossary</a><a href="{{ root }}method/">Method</a><a href="{{ root }}downloads/">Data</a>
    </nav>
  </div>
</header>
<main id="content" class="shell {% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>
<footer class="site-footer"><div class="shell"><p>itibar computes and reports; it issues no verdict of its own. Data: hadith-kg (CC-BY 4.0) · <a href="{{ root }}downloads/">Data and licences</a> · <a href="{{ repo }}">Code</a></p></div></footer>
</body>
</html>
