name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install dependencies
        run: uv sync --frozen
      - name: Pipeline and tests on the committed fixture
        run: make ci
      - name: Render a gold bundle
        run: |
          ITIBAR_PARQUET_DIR=$PWD/tests/fixture/parquet ITIBAR_OUT_DIR=$PWD/.ci-out ITIBAR_FIGURES_DIR=$PWD/.ci-out/figures \
            uv run itibar render 319
          ITIBAR_PARQUET_DIR=$PWD/tests/fixture/parquet ITIBAR_OUT_DIR=$PWD/.ci-out \
            uv run itibar show 319 > /dev/null
      - name: Build and check the fixture site
        run: make site-fixture

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: itibar-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    env:
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
      HF_HUB_ETAG_TIMEOUT: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/configure-pages@v5
      - name: Restore the pinned source database
        uses: actions/cache@v4
        with:
          path: data/hadith-kg.db
          key: hadith-kg-${{ hashFiles('config/source.yaml') }}
      - name: Fetch the pinned source database (skipped when cached)
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            uv run python -c 'from itibar.data import download; download()' && exit 0
            echo "download attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1
      - name: Rebuild the full corpus outputs
        timeout-minutes: 25
        run: |
          make data bundles
          uv run python -c 'from itibar.narrators import build; build()'
      - name: Build and check the publish tree
        timeout-minutes: 15
        run: make site site-check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      - name: Wait for the uploaded artifact to be listed (only after a failed deploy)
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - uses: actions/deploy-pages@v4
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
